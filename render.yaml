services:
  - type: web
    name: splitflux-server
    runtime: node
    plan: free
    region: virginia
    numInstances: 1
    buildCommand: npm install --omit=dev
    startCommand: node live-runtime.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
