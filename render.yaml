services:
  - type: web
    name: splitflux-server
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    buildCommand: node --check server.cjs
    startCommand: node server.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SPLITFLUX_DATA_DIR
        value: /var/data/splitflux
      - key: SPLITFLUX_OWNER_PASSWORD
        sync: false
    disk:
      name: splitflux-data
      mountPath: /var/data
      sizeGB: 1
